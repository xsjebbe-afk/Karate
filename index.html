<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Karate Pensum</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;700&family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0f;
    --card-bg: #111118;
    --accent: #c8a96e;
    --accent2: #e84545;
    --text: #f0ede8;
    --muted: #6b6870;
    --border: rgba(200,169,110,0.2);
  }

  html, body {
    width: 100%; height: 100%;
    background: var(--bg);
    font-family: 'DM Sans', sans-serif;
    color: var(--text);
    overflow: hidden;
    touch-action: pan-y;
  }

  /* Floating background kanji */
  .bg-kanji {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 0;
  }
  .bg-kanji span {
    position: absolute;
    font-family: 'Noto Serif JP', serif;
    color: rgba(200,169,110,0.04);
    font-size: clamp(80px, 20vw, 160px);
    font-weight: 700;
    animation: drift linear infinite;
    user-select: none;
  }
  @keyframes drift {
    0% { transform: translateY(110vh) rotate(-15deg); opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 1; }
    100% { transform: translateY(-20vh) rotate(15deg); opacity: 0; }
  }

  /* App shell */
  .app {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 1;
    padding: 24px 16px;
  }

  /* Header */
  .header {
    position: fixed;
    top: 0; left: 0; right: 0;
    padding: 52px 24px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 10;
  }
  .header-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 13px;
    letter-spacing: 4px;
    color: var(--accent);
    opacity: 0.8;
  }
  .category-badge {
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 4px 10px;
    border: 1px solid var(--border);
    border-radius: 20px;
    color: var(--muted);
  }

  /* Progress */
  .progress-bar {
    position: fixed;
    top: 0; left: 0;
    height: 2px;
    background: var(--accent);
    transition: width 0.4s ease;
    z-index: 20;
    box-shadow: 0 0 8px var(--accent);
  }

  /* Card container */
  .card-container {
    width: 100%;
    max-width: 380px;
    perspective: 1000px;
    position: relative;
  }

  /* Card */
  .card {
    width: 100%;
    min-height: 420px;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    cursor: pointer;
  }
  .card.flipped { transform: rotateY(180deg); }
  .card.slide-out-left {
    animation: slideOutLeft 0.35s ease forwards;
  }
  .card.slide-out-right {
    animation: slideOutRight 0.35s ease forwards;
  }
  .card.slide-in-left {
    animation: slideInLeft 0.35s ease forwards;
  }
  .card.slide-in-right {
    animation: slideInRight 0.35s ease forwards;
  }

  @keyframes slideOutLeft {
    to { transform: translateX(-110%) rotate(-8deg); opacity: 0; }
  }
  @keyframes slideOutRight {
    to { transform: translateX(110%) rotate(8deg); opacity: 0; }
  }
  @keyframes slideInLeft {
    from { transform: translateX(60%) rotate(4deg); opacity: 0; }
    to { transform: translateX(0) rotate(0deg); opacity: 1; }
  }
  @keyframes slideInRight {
    from { transform: translateX(-60%) rotate(-4deg); opacity: 0; }
    to { transform: translateX(0) rotate(0deg); opacity: 1; }
  }

  .card-face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    border-radius: 24px;
    padding: 40px 32px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    min-height: 420px;
  }

  .card-front {
    background: var(--card-bg);
    border: 1px solid var(--border);
    box-shadow:
      0 0 0 1px rgba(200,169,110,0.05),
      0 24px 80px rgba(0,0,0,0.6),
      inset 0 1px 0 rgba(200,169,110,0.1);
  }

  .card-back {
    background: linear-gradient(145deg, #16141f, #0f0e17);
    border: 1px solid rgba(232,69,69,0.2);
    transform: rotateY(180deg);
    box-shadow:
      0 0 0 1px rgba(232,69,69,0.05),
      0 24px 80px rgba(0,0,0,0.6),
      inset 0 1px 0 rgba(232,69,69,0.1);
  }

  .cat-icon {
    font-size: 42px;
    margin-bottom: 20px;
    filter: drop-shadow(0 0 12px rgba(200,169,110,0.3));
  }

  .japanese-term {
    font-family: 'Noto Serif JP', serif;
    font-size: clamp(22px, 6vw, 30px);
    font-weight: 400;
    color: var(--accent);
    letter-spacing: 1px;
    margin-bottom: 8px;
    line-height: 1.3;
  }

  .hint-text {
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-top: 28px;
  }
  .hint-text span {
    display: inline-block;
    animation: pulse 2s ease infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.4; }
    50% { opacity: 1; }
  }

  /* Back face */
  .danish-translation {
    font-size: clamp(26px, 7vw, 36px);
    font-weight: 500;
    color: var(--text);
    line-height: 1.2;
    margin-bottom: 12px;
  }

  .category-label {
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--accent2);
    margin-top: 16px;
    opacity: 0.8;
  }

  .term-reminder {
    font-family: 'Noto Serif JP', serif;
    font-size: 14px;
    color: var(--muted);
    margin-top: 8px;
  }

  /* Nav dots */
  .nav-dots {
    display: flex;
    gap: 6px;
    margin-top: 28px;
    align-items: center;
  }
  .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--muted);
    opacity: 0.3;
    transition: all 0.3s ease;
  }
  .dot.active {
    background: var(--accent);
    opacity: 1;
    width: 20px;
    border-radius: 3px;
  }

  /* Swipe hint */
  .swipe-hint {
    position: fixed;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 16px;
    z-index: 10;
  }
  .swipe-btn {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: rgba(255,255,255,0.03);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.2s;
    backdrop-filter: blur(10px);
    font-size: 18px;
    color: var(--muted);
    -webkit-tap-highlight-color: transparent;
  }
  .swipe-btn:active {
    background: rgba(200,169,110,0.1);
    border-color: var(--accent);
    color: var(--accent);
    transform: scale(0.92);
  }

  .counter {
    font-size: 13px;
    color: var(--muted);
    letter-spacing: 1px;
    min-width: 52px;
    text-align: center;
  }
  .counter b {
    color: var(--accent);
    font-weight: 500;
  }

  /* Mode toggle */
  .mode-toggle {
    position: fixed;
    top: 52px;
    right: 24px;
    display: flex;
    gap: 4px;
    z-index: 20;
  }
  .mode-btn {
    font-size: 10px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    padding: 5px 10px;
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.2s;
    -webkit-tap-highlight-color: transparent;
    color: var(--muted);
    background: transparent;
    border: 1px solid transparent;
  }
  .mode-btn.active {
    color: var(--accent);
    border-color: var(--border);
    background: rgba(200,169,110,0.06);
  }

  /* Category filter */
  .cat-filter {
    position: fixed;
    top: 80px;
    left: 0; right: 0;
    display: flex;
    gap: 8px;
    padding: 0 20px;
    overflow-x: auto;
    z-index: 10;
    scrollbar-width: none;
    justify-content: center;
  }
  .cat-filter::-webkit-scrollbar { display: none; }
  .cat-btn {
    flex-shrink: 0;
    font-size: 11px;
    letter-spacing: 1.5px;
    padding: 6px 14px;
    border-radius: 16px;
    cursor: pointer;
    transition: all 0.2s;
    -webkit-tap-highlight-color: transparent;
    color: var(--muted);
    background: transparent;
    border: 1px solid rgba(255,255,255,0.08);
    white-space: nowrap;
    text-transform: uppercase;
  }
  .cat-btn.active {
    color: var(--bg);
    background: var(--accent);
    border-color: var(--accent);
  }

  /* Score overlay */
  .score-overlay {
    position: fixed;
    inset: 0;
    background: rgba(10,10,15,0.97);
    z-index: 100;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s;
  }
  .score-overlay.visible {
    opacity: 1;
    pointer-events: all;
  }
  .score-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 56px;
    color: var(--accent);
    letter-spacing: 6px;
    margin-bottom: 8px;
  }
  .score-sub {
    color: var(--muted);
    font-size: 14px;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 48px;
  }
  .score-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 16px;
    width: 100%;
    max-width: 340px;
    margin-bottom: 48px;
  }
  .score-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px 12px;
    text-align: center;
  }
  .score-num {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 42px;
    color: var(--accent);
    line-height: 1;
  }
  .score-lbl {
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-top: 4px;
  }
  .restart-btn {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 18px;
    letter-spacing: 4px;
    padding: 16px 48px;
    border-radius: 100px;
    background: var(--accent);
    color: var(--bg);
    border: none;
    cursor: pointer;
    transition: all 0.2s;
  }
  .restart-btn:active {
    transform: scale(0.96);
  }

  /* Quiz mode */
  .quiz-options {
    display: flex;
    flex-direction: column;
    gap: 10px;
    width: 100%;
    margin-top: 12px;
  }
  .quiz-opt {
    padding: 14px 20px;
    border-radius: 14px;
    border: 1px solid rgba(255,255,255,0.08);
    background: rgba(255,255,255,0.02);
    color: var(--text);
    font-size: 15px;
    cursor: pointer;
    transition: all 0.2s;
    text-align: left;
    -webkit-tap-highlight-color: transparent;
  }
  .quiz-opt.correct {
    background: rgba(80,200,120,0.15);
    border-color: rgba(80,200,120,0.4);
    color: #50c878;
  }
  .quiz-opt.wrong {
    background: rgba(232,69,69,0.1);
    border-color: rgba(232,69,69,0.3);
    color: var(--accent2);
  }
  .quiz-opt:not([disabled]):hover {
    border-color: var(--border);
    background: rgba(200,169,110,0.06);
  }

  /* Shuffle indicator */
  .shuffle-indicator {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    letter-spacing: 5px;
    color: var(--accent);
    opacity: 0;
    pointer-events: none;
    z-index: 50;
    transition: opacity 0.3s;
  }
  .shuffle-indicator.show {
    opacity: 1;
    animation: shufflePop 0.8s ease forwards;
  }
  @keyframes shufflePop {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(0.8); }
    30% { opacity: 1; transform: translate(-50%, -50%) scale(1.05); }
    70% { opacity: 1; }
    100% { opacity: 0; transform: translate(-50%, -50%) scale(1); }
  }
</style>
</head>
<body>

<div class="bg-kanji" id="bgKanji"></div>
<div class="progress-bar" id="progressBar"></div>

<div class="app">
  <div class="header">
    <div class="header-title">空手 · Karate</div>
  </div>

  <div class="cat-filter" id="catFilter"></div>

  <div class="card-container" id="cardContainer">
    <div class="card" id="mainCard">
      <div class="card-face card-front" id="cardFront"></div>
      <div class="card-face card-back" id="cardBack"></div>
    </div>
  </div>

  <div class="nav-dots" id="navDots"></div>

  <div class="swipe-hint">
    <button class="swipe-btn" id="prevBtn">←</button>
    <div class="counter" id="counter"></div>
    <button class="swipe-btn" id="nextBtn">→</button>
  </div>
</div>

<div class="score-overlay" id="scoreOverlay">
  <div class="score-title">FÆRDIG!</div>
  <div class="score-sub">Runde afsluttet</div>
  <div class="score-grid">
    <div class="score-card">
      <div class="score-num" id="scoreTotal">0</div>
      <div class="score-lbl">Total</div>
    </div>
    <div class="score-card">
      <div class="score-num" id="scoreCorrect" style="color:#50c878">0</div>
      <div class="score-lbl">Rigtige</div>
    </div>
    <div class="score-card">
      <div class="score-num" id="scoreWrong" style="color:var(--accent2)">0</div>
      <div class="score-lbl">Forkerte</div>
    </div>
  </div>
  <button class="restart-btn" id="restartBtn">PRØV IGEN</button>
</div>

<div class="shuffle-indicator" id="shuffleIndicator">BLANDET!</div>

<script>
const DATA = [
  { cat: 'Stød', catEn: '突き', icon: '👊', term: 'Seiken-gedan-tsuki', meaning: 'Stød mod skridtet' },
  { cat: 'Stød', catEn: '突き', icon: '👊', term: 'Seiken-chudan-tsuki', meaning: 'Stød mod maven' },
  { cat: 'Stød', catEn: '突き', icon: '👊', term: 'Seiken-jodan-tsuki', meaning: 'Stød mod hovedet' },
  { cat: 'Stød', catEn: '突き', icon: '👊', term: 'Seiken-ago-uchi', meaning: 'Snapslag mod hagen' },
  { cat: 'Parader', catEn: '受け', icon: '🛡️', term: 'Gedan-uke', meaning: 'Nedadgående parade' },
  { cat: 'Parader', catEn: '受け', icon: '🛡️', term: 'Soto-uke', meaning: 'Udvendig parade' },
  { cat: 'Parader', catEn: '受け', icon: '🛡️', term: 'Uchi-uke', meaning: 'Indvendig parade' },
  { cat: 'Parader', catEn: '受け', icon: '🛡️', term: 'Jodan-uke', meaning: 'Opadgående parade' },
  { cat: 'Spark', catEn: '蹴り', icon: '🦵', term: 'Kin-geri', meaning: 'Skridtspark' },
  { cat: 'Spark', catEn: '蹴り', icon: '🦵', term: 'Mae-geri-chudan', meaning: 'Frontspark mod maven' },
  { cat: 'Spark', catEn: '蹴り', icon: '🦵', term: 'Mae-geri-jodan', meaning: 'Frontspark mod hovedet' },
  { cat: 'Spark', catEn: '蹴り', icon: '🦵', term: 'Hiza-geri', meaning: 'Knæspark' },
];

const KANJI = ['空', '手', '道', '力', '技', '蹴', '突', '受'];
let deck = [...DATA];
let currentIdx = 0;
let flipped = false;
let activeFilter = 'Alle';
let mode = 'flash'; // flash | quiz
let score = { correct: 0, wrong: 0 };
let quizAnswered = false;

// Background kanji
function initBgKanji() {
  const container = document.getElementById('bgKanji');
  KANJI.forEach((k, i) => {
    const span = document.createElement('span');
    span.textContent = k;
    const left = Math.random() * 90;
    const dur = 12 + Math.random() * 18;
    const delay = -(Math.random() * dur);
    span.style.cssText = `left:${left}%;animation-duration:${dur}s;animation-delay:${delay}s`;
    container.appendChild(span);
  });
}

// Filter
function initFilters() {
  const cats = ['Alle', 'Stød', 'Parader', 'Spark'];
  const container = document.getElementById('catFilter');
  cats.forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'cat-btn' + (c === 'Alle' ? ' active' : '');
    btn.textContent = c;
    btn.onclick = () => setFilter(c);
    container.appendChild(btn);
  });
}

function setFilter(cat) {
  activeFilter = cat;
  document.querySelectorAll('.cat-btn').forEach(b => {
    b.classList.toggle('active', b.textContent === cat);
  });
  deck = cat === 'Alle' ? [...DATA] : DATA.filter(d => d.cat === cat);
  currentIdx = 0;
  score = { correct: 0, wrong: 0 };
  renderCard(false);
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
}

function renderCard(animate, dir = 'right') {
  const card = DATA[0]; // placeholder
  const c = deck[currentIdx];
  flipped = false;
  quizAnswered = false;

  const front = document.getElementById('cardFront');
  const back = document.getElementById('cardBack');
  const mainCard = document.getElementById('mainCard');
  mainCard.classList.remove('flipped');

  if (mode === 'flash') {
    front.innerHTML = `
      <div class="cat-icon">${c.icon}</div>
      <div class="japanese-term">${c.term}</div>
      <div style="width:40px;height:1px;background:var(--border);margin:20px auto"></div>
      <div style="font-size:12px;color:var(--muted);letter-spacing:2px;text-transform:uppercase">${c.cat} · ${c.catEn}</div>
      <div class="hint-text"><span>Tryk for at se svar</span></div>
    `;
    back.innerHTML = `
      <div class="cat-icon">${c.icon}</div>
      <div class="danish-translation">${c.meaning}</div>
      <div class="term-reminder">${c.term}</div>
      <div class="category-label">${c.cat}</div>
    `;
    front.style.cursor = 'pointer';
    front.onclick = flipCard;
    back.onclick = flipCard;
  } else {
    // Quiz mode
    const opts = buildQuizOptions(c);
    front.innerHTML = `
      <div class="cat-icon">${c.icon}</div>
      <div class="japanese-term">${c.term}</div>
      <div style="width:40px;height:1px;background:var(--border);margin:16px auto"></div>
      <div style="font-size:11px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-bottom:8px">${c.cat}</div>
      <div class="quiz-options" id="quizOpts"></div>
    `;
    front.style.cursor = 'default';
    front.onclick = null;
    back.innerHTML = '';
    const optsContainer = document.getElementById('quizOpts');
    opts.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'quiz-opt';
      btn.textContent = opt;
      btn.onclick = () => handleQuizAnswer(opt, c.meaning, btn);
      optsContainer.appendChild(btn);
    });
  }

  updateProgress();
  updateDots();
  updateCounter();
}

function buildQuizOptions(correct) {
  const pool = deck.filter(d => d.meaning !== correct.meaning);
  shuffle(pool);
  const wrong = pool.slice(0, 3).map(d => d.meaning);
  const all = [...wrong, correct.meaning];
  shuffle(all);
  return all;
}

function handleQuizAnswer(chosen, correct, btn) {
  if (quizAnswered) return;
  quizAnswered = true;
  const isCorrect = chosen === correct;
  if (isCorrect) {
    score.correct++;
    btn.classList.add('correct');
  } else {
    score.wrong++;
    btn.classList.add('wrong');
    document.querySelectorAll('.quiz-opt').forEach(b => {
      if (b.textContent === correct) b.classList.add('correct');
    });
  }
  document.querySelectorAll('.quiz-opt').forEach(b => b.setAttribute('disabled', true));
  setTimeout(() => {
    if (currentIdx < deck.length - 1) {
      goNext();
    } else {
      showScore();
    }
  }, 1100);
}

function flipCard() {
  flipped = !flipped;
  document.getElementById('mainCard').classList.toggle('flipped', flipped);
}

function goNext() {
  if (currentIdx < deck.length - 1) {
    currentIdx++;
    animateCard('left');
  } else if (mode === 'flash') {
    showScore();
  }
}

function goPrev() {
  if (currentIdx > 0) {
    currentIdx--;
    animateCard('right');
  }
}

function animateCard(dir) {
  const mainCard = document.getElementById('mainCard');
  const outClass = dir === 'left' ? 'slide-out-left' : 'slide-out-right';
  const inClass = dir === 'left' ? 'slide-in-left' : 'slide-in-right';
  mainCard.classList.add(outClass);
  setTimeout(() => {
    mainCard.classList.remove(outClass);
    renderCard(false, dir);
    mainCard.classList.add(inClass);
    setTimeout(() => mainCard.classList.remove(inClass), 350);
  }, 300);
}

function updateProgress() {
  const pct = ((currentIdx + 1) / deck.length) * 100;
  document.getElementById('progressBar').style.width = pct + '%';
}

function updateDots() {
  const container = document.getElementById('navDots');
  const max = Math.min(deck.length, 12);
  container.innerHTML = '';
  for (let i = 0; i < max; i++) {
    const dot = document.createElement('div');
    dot.className = 'dot' + (i === currentIdx ? ' active' : '');
    container.appendChild(dot);
  }
}

function updateCounter() {
  document.getElementById('counter').innerHTML = `<b>${currentIdx + 1}</b> / ${deck.length}`;
}

function showScore() {
  document.getElementById('scoreTotal').textContent = deck.length;
  document.getElementById('scoreCorrect').textContent = score.correct;
  document.getElementById('scoreWrong').textContent = mode === 'quiz' ? score.wrong : deck.length - score.correct;
  document.getElementById('scoreOverlay').classList.add('visible');
}

function restart() {
  document.getElementById('scoreOverlay').classList.remove('visible');
  shuffle(deck);
  currentIdx = 0;
  score = { correct: 0, wrong: 0 };
  const ind = document.getElementById('shuffleIndicator');
  ind.classList.add('show');
  setTimeout(() => ind.classList.remove('show'), 800);
  renderCard(false);
}

// Touch swipe
let touchStartX = 0;
let touchStartY = 0;
document.getElementById('cardContainer').addEventListener('touchstart', e => {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
}, { passive: true });

document.getElementById('cardContainer').addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 40) {
    if (dx < 0) goNext();
    else goPrev();
  } else if (Math.abs(dy) < 20 && Math.abs(dx) < 20 && mode === 'flash') {
    flipCard();
  }
}, { passive: true });

document.getElementById('prevBtn').onclick = goPrev;
document.getElementById('nextBtn').onclick = goNext;
document.getElementById('restartBtn').onclick = restart;

// Init
initBgKanji();
initFilters();
shuffle(deck);
renderCard(false);
</script>
</body>
</html>
